[tool.poetry]
name = "shrike-guard"
version = "4.1.0"
description = "Shrike SDK for AI agent action governance — drop-in wrapper for OpenAI, Anthropic, and Gemini that governs every tool call, prompt, and response server-side. Allow / approve / block. Free tier available."
authors = ["Shrike Security <security@shrikesecurity.com>"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["action-governance", "ai-agents", "agent-security", "agent-governance", "tool-call-gating", "ai-governance", "openai", "anthropic", "claude", "gemini", "llm", "prompt-injection", "pii", "jailbreak", "ai-safety"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{include = "shrike_guard", from = "src"}]
include = ["CHANGELOG.md"]

[tool.poetry.urls]
"Homepage" = "https://shrikesecurity.com"
"Documentation" = "https://shrikesecurity.com/docs/sdk"
"Repository" = "https://github.com/Shrike-Security/shrike-guard-python"
"Bug Tracker" = "https://github.com/Shrike-Security/shrike-guard-python/issues"

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.28.1"
# Core provider (always available). Upper bound tracks the current major; the
# wrapper only touches chat.completions.create, stable across openai 1.x-3.x.
openai = ">=1.0.0,<4.0.0"
# Optional providers. anthropic bound covers the 1.x major (wrapper uses only
# messages.create, unchanged since 0.18); google-genai stays on the 1.x-2.x line.
anthropic = {version = ">=0.18.0,<2.0.0", optional = true}
google-genai = {version = ">=1.0.0,<3.0.0", optional = true}
# Transitive-dep floor: cryptography is pulled via google-auth via google-genai
# and pinned here as a marker dep with `optional = true` so it follows the gemini
# extra and only lands when the user installs that extra — but the floor still
# applies when it does, satisfying SCA scanners (Trivy/pip-audit) on the lockfile.
# Floor >=50.0.0 clears: GHSA-537c-gmf6-5ccf (<48.0.1 vulnerable OpenSSL wheel)
# and PYSEC-2026-3552 (49.0.0, fixed in 50.0.0).
cryptography = {version = ">=50.0.0", optional = true}

[tool.poetry.extras]
anthropic = ["anthropic"]
gemini = ["google-genai", "cryptography"]
all = ["anthropic", "google-genai", "cryptography"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
